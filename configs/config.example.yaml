server:
  port: 8080
  host: "0.0.0.0"

hue:
  bridge_ip: ""           # Leave empty for auto-discovery
  application_key: ""     # Will be set during pairing

loxone:
  # One entry per Loxone Miniserver. Normally managed through the web frontend.
  miniservers: []
  # Example:
  # miniservers:
  #   - id: "generated-uuid"      # Stable ID, referenced by mappings
  #     name: "Miniserver"
  #     ip: "192.168.1.10"
  #     port: 7777                # UDP target port
  #     udp_enabled: true         # Send status updates via UDP
  #     http_enabled: false       # Send status updates via HTTP (virtual HTTP input)
  #     http_url: ""              # Optional, defaults to http://<ip>
  #     http_user: ""
  #     http_password: ""
  #     send_all: false           # Also send updates for unmapped devices

logging:
  level: "info"           # debug, info, warn, error
  format: "json"          # json or console

# Mappings are configured via the web frontend
mappings: []
