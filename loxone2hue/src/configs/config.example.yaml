server:
  port: 8080
  host: "0.0.0.0"

hue:
  bridge_ip: ""           # Leave empty for auto-discovery
  application_key: ""     # Will be set during pairing

loxone:
  enabled: true
  miniserver_ip: ""       # Optional: Loxone Miniserver IP
  udp_feedback:
    enabled: false        # Send HUE status changes via UDP to Loxone (uses miniserver_ip as target)
    port: 7777            # UDP target port

logging:
  level: "info"           # debug, info, warn, error
  format: "json"          # json or console

# Mappings are configured via the web frontend
mappings: []
