version: '3.8'

# Loxone2HUE Gateway für Synology NAS
#
# Verwendung:
#   1. Diesen Ordner auf das NAS kopieren
#   2. docker-compose up -d --build
#   3. Web-UI: http://<NAS-IP>:8080

services:
  loxone2hue:
    build:
      context: ..
      dockerfile: synology/Dockerfile
    image: loxone2hue:latest
    container_name: loxone2hue
    restart: unless-stopped
    network_mode: host
    volumes:
      - loxone2hue-data:/data
    environment:
      - TZ=Europe/Zurich

volumes:
  loxone2hue-data:
